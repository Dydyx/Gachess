<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#302e2b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gachess">
  <title>Gachess — échecs personnalisables</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>
    // Téléphone : disposition et tailles dédiées, fixes pour l'appareil
    window.GACHESS_MOBILE = matchMedia('(max-width: 820px)').matches ||
      (matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820);
    if (window.GACHESS_MOBILE) document.documentElement.classList.add('mobile');
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ================= MENU PRINCIPAL ================= -->
  <section id="screen-menu" class="screen active">
    <div class="menu-card">
      <div class="menu-logo">
        <img id="logo-img" alt="">
        <div>
          <h1>Gachess</h1>
          <span>contre Stockfish 19 · pièces personnalisables</span>
        </div>
      </div>

      <div class="menu-section">
        <div class="menu-label">Je joue avec</div>
        <div class="color-choice" id="color-choice">
          <button data-color="white" title="Blancs"><img data-piece="white" alt="Blancs"></button>
          <button data-color="random" title="Aléatoire"><span class="random-king"><img data-piece="white" alt=""><img data-piece="black" alt=""></span></button>
          <button data-color="black" title="Noirs"><img data-piece="black" alt="Noirs"></button>
        </div>
        <div class="color-caption" id="color-caption">Blancs</div>
      </div>

      <div class="menu-section">
        <div class="menu-label">Niveau du bot <b><span id="elo-value">1500</span> Elo</b></div>
        <div class="elo-row">
          <button class="elo-step" id="elo-minus" title="-100">−</button>
          <input type="range" id="elo" min="400" max="2800" step="100" value="1500">
          <button class="elo-step" id="elo-plus" title="+100">+</button>
        </div>
        <div class="elo-caption" id="elo-caption">Intermédiaire</div>
      </div>

      <button class="btn btn-primary btn-big" id="btn-custom-game">Lancer une partie personnalisée</button>
      <button class="btn" id="btn-customize">Personnalisation</button>
      <button class="btn" id="btn-classic">Lancer une partie classique</button>
      <div class="engine-status" id="engine-status">Chargement de Stockfish 19…</div>
    </div>
  </section>

  <!-- ================= PARTIE ================= -->
  <section id="screen-game" class="screen">
    <div class="game-layout">
      <aside class="powers-panel" id="powers-panel">
        <div class="plan-box" id="plan-box">
          <div class="plan-title">Plan secondaire <span id="plan-timer"></span></div>
          <div id="plan-board"></div>
        </div>
        <div id="powers-content"></div>
      </aside>
      <div class="board-col">
        <div class="player-bar" id="bar-top"></div>
        <div id="game-board"></div>
        <div class="player-bar" id="bar-bottom"></div>
      </div>
      <div class="mobile-tabs" id="mobile-tabs">
        <button data-tab="game" class="active">Partie</button>
        <button data-tab="powers">Pouvoirs en jeu</button>
      </div>
      <aside class="side-panel">
        <div class="side-head">
          <img id="side-icon" alt="">
          <div>
            <div class="side-title" id="side-title">Partie classique</div>
            <div class="side-sub" id="side-sub"></div>
          </div>
        </div>
        <div class="status-line" id="status-line"></div>
        <div class="moves" id="move-list"></div>
        <div class="nav-row">
          <button id="nav-first" title="Début">⏮</button>
          <button id="nav-prev" title="Coup précédent (←)">◀</button>
          <button id="nav-next" title="Coup suivant (→)">▶</button>
          <button id="nav-last" title="Position actuelle">⏭</button>
          <button id="nav-flip" title="Retourner l'échiquier">⇅</button>
        </div>
        <div class="side-actions">
          <button class="btn btn-small btn-power" id="btn-power" style="display:none">✦ Pouvoir spécial</button>
          <button class="btn btn-small btn-danger" id="btn-resign">⚑ Abandonner</button>
        </div>
        <div class="side-bottom">
          <button class="btn" id="btn-game-menu">Retour au menu</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- ================= PERSONNALISATION ================= -->
  <section id="screen-custom" class="screen">
    <div class="custom-layout">
      <aside class="custom-panel" id="custom-panel"></aside>
      <div class="custom-board-col">
        <div class="custom-head">
          <h2>Personnalisation</h2>
          <span id="custom-summary"></span>
        </div>
        <div id="custom-board"></div>
        <div class="custom-toolbar">
          <button class="btn" id="cz-undo">↶ Annuler</button>
          <button class="btn" id="cz-reset">Annuler tout</button>
          <button class="btn btn-primary" id="cz-save">Sauvegarder</button>
          <button class="btn" id="cz-load">Charger</button>
          <button class="btn" id="cz-export">Exporter</button>
          <button class="btn" id="cz-import">Importer</button>
          <button class="btn wide" id="cz-menu">Revenir au menu</button>
        </div>
        <div class="arch-shortcuts" id="arch-shortcuts"></div>
      </div>
    </div>
  </section>

  <div id="modal-root"></div>
  <div id="toast"></div>

  <script src="js/rules.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/board.js"></script>
  <script src="js/bots.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
